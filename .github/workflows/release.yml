name: Release

# Publishes both packages to npm when a version tag is pushed:
#   node scripts/set-version.mjs 0.2.0 && git commit -am "Release 0.2.0" && git tag v0.2.0 && git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance, and trusted publishing if it is configured on npmjs.com

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the tag matches both package versions
        run: node scripts/set-version.mjs --check "${GITHUB_REF_NAME#v}"
      - run: npm run check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:packed
      # The core goes first: the React package depends on this exact release line.
      - name: Publish @markwylde/chara
        run: node scripts/publish.mjs @markwylde/chara
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @markwylde/chara-react
        run: node scripts/publish.mjs @markwylde/chara-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
