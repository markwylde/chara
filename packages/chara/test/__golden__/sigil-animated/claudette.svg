<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true" overflow="visible" class="chara chara-sigil chara-d6" data-state="thinking"><style>.chara-sigil[data-state] *{animation-delay:var(--chara-d,0s)!important}.chara-sigil[data-state].chara-d1{--chara-d:-0.6s}.chara-sigil[data-state].chara-d2{--chara-d:-1.2s}.chara-sigil[data-state].chara-d3{--chara-d:-1.8s}.chara-sigil[data-state].chara-d4{--chara-d:-2.4s}.chara-sigil[data-state].chara-d5{--chara-d:-3.0s}.chara-sigil[data-state].chara-d6{--chara-d:-3.6s}.chara-sigil[data-state].chara-d7{--chara-d:-4.2s}.chara-sigil[data-state] :is(.chara-body,.chara-dots,.chara-ring){transform-box:fill-box;transform-origin:center}.chara-sigil[data-state] .chara-body{animation:chara-sigil-pulse 4.2s ease-in-out infinite}.chara-sigil[data-state] .chara-dots{animation:chara-sigil-glow 2.8s ease-in-out infinite}.chara-sigil[data-state=thinking] .chara-line{stroke-dasharray:.1 8.4;animation:chara-sigil-march .7s linear infinite}.chara-sigil[data-state=thinking] .chara-dots{animation:chara-sigil-glow .9s ease-in-out infinite}.chara-sigil[data-state=working] .chara-line{stroke-dasharray:17 17;animation:chara-sigil-draw 1.5s ease-in-out infinite}.chara-sigil[data-state=working] .chara-ring{stroke-dasharray:9 7;animation:chara-sigil-spin 6s linear infinite}.chara-sigil[data-state=success] .chara-body{animation:chara-sigil-pop 1.7s ease-out infinite}.chara-sigil[data-state=error] :is(.chara-line,.chara-ring){stroke:#ff5247}.chara-sigil[data-state=error] .chara-ink{fill:#ff5247}.chara-sigil[data-state=error][data-mono] :is(.chara-line,.chara-ring){stroke:#8c8c8c}.chara-sigil[data-state=error][data-mono] .chara-ink{fill:#8c8c8c}.chara-sigil[data-state=error] .chara-line{stroke-dasharray:9 5;animation:chara-sigil-flicker 1.9s steps(1) infinite}.chara-sigil[data-state=sleeping] .chara-body{animation:chara-sigil-dim 5s ease-in-out infinite}.chara-sigil[data-state=sleeping] .chara-dots{animation:none;opacity:.25}.chara-sigil[data-state=error] .chara-body{animation:chara-sigil-shake 1.9s ease-in-out infinite,chara-sigil-alarm 1.3s ease-in-out infinite}.chara-sigil[data-state=error][data-mono] .chara-body{animation:chara-sigil-shake 1.9s ease-in-out infinite,chara-sigil-alarm-mono 1.3s ease-in-out infinite}@keyframes chara-sigil-alarm{0%,100%{filter:drop-shadow(0 0 1.5px #ff5247) drop-shadow(0 0 4px #ff5247)}50%{filter:drop-shadow(0 0 3px #ff5247) drop-shadow(0 0 8px #ff5247)}}@keyframes chara-sigil-alarm-mono{0%,100%{filter:drop-shadow(0 0 1.5px #8c8c8c) drop-shadow(0 0 4px #8c8c8c)}50%{filter:drop-shadow(0 0 3px #8c8c8c) drop-shadow(0 0 8px #8c8c8c)}}@keyframes chara-sigil-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}@keyframes chara-sigil-glow{0%,100%{opacity:1}50%{opacity:.45}}@keyframes chara-sigil-march{to{stroke-dashoffset:-8.5}}@keyframes chara-sigil-draw{0%{stroke-dashoffset:17}45%,60%{stroke-dashoffset:0}100%{stroke-dashoffset:-17}}@keyframes chara-sigil-spin{to{transform:rotate(360deg)}}@keyframes chara-sigil-pop{0%,62%,100%{transform:scale(1) rotate(0)}22%{transform:scale(1.16) rotate(8deg)}40%{transform:scale(.97) rotate(-3deg)}52%{transform:scale(1.03)}}@keyframes chara-sigil-shake{0%,30%,100%{transform:translateX(0) rotate(0)}5%{transform:translateX(-2.2px) rotate(-2deg)}10%{transform:translateX(2.2px) rotate(2deg)}15%{transform:translateX(-1.8px) rotate(-1.5deg)}20%{transform:translateX(1.4px) rotate(1deg)}25%{transform:translateX(-.8px)}}@keyframes chara-sigil-flicker{0%,100%{opacity:1}8%{opacity:.35}12%{opacity:1}18%{opacity:.5}24%{opacity:1}}@keyframes chara-sigil-dim{0%,100%{opacity:.38;transform:scale(.97)}50%{opacity:.6;transform:scale(1)}}@media (prefers-reduced-motion:reduce){.chara-sigil[data-state] *{animation:none!important}}</style><defs><linearGradient id="c0bz6psw0mmvbbb-ink" gradientUnits="userSpaceOnUse" x1="14" y1="14" x2="86" y2="86"><stop offset="0" stop-color="#3eea4f"/><stop offset="1" stop-color="#b0e817"/></linearGradient></defs><g