<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true" overflow="visible" class="chara chara-mecha chara_d6" data-state="thinking"><style>.chara-mecha[data-state],.chara-mecha[data-state] *{animation-delay:var(--chara-d,0s)!important}.chara-mecha[data-state].chara_d1{--chara-d:-0.6s}.chara-mecha[data-state].chara_d2{--chara-d:-1.2s}.chara-mecha[data-state].chara_d3{--chara-d:-1.8s}.chara-mecha[data-state].chara_d4{--chara-d:-2.4s}.chara-mecha[data-state].chara_d5{--chara-d:-3.0s}.chara-mecha[data-state].chara_d6{--chara-d:-3.6s}.chara-mecha[data-state].chara_d7{--chara-d:-4.2s}.chara-mecha[data-state] :is(.chara-body,.chara-top,.chara-eyes,.chara-look,.chara-mouth,.chara-arm,.chara-shadow,.chara-glow,.chara-z){transform-box:fill-box;transform-origin:center}.chara-mecha[data-state] .chara-top{transform-origin:50% 100%}.chara-mecha[data-state] .chara-arm-l{transform-origin:85% 15%}.chara-mecha[data-state] .chara-arm-r{transform-origin:15% 15%}.chara-mecha[data-state] .chara-eyes{animation:chara-mecha_blink 4.6s infinite}.chara-mecha[data-state] .chara-glow{animation:chara-mecha_glow 2.6s ease-in-out infinite}.chara-mecha[data-state] .chara-body{animation:chara-mecha_float 3.8s ease-in-out infinite}.chara-mecha[data-state] .chara-shadow{animation:chara-mecha_shadow 3.8s ease-in-out infinite}.chara-mecha[data-state] .chara-top{animation:chara-mecha_sway 5.2s ease-in-out infinite}.chara-mecha[data-state=thinking] .chara-look{animation:chara-mecha_look 3.4s ease-in-out infinite}.chara-mecha[data-state=thinking] .chara-glow{animation:chara-mecha_glow .9s ease-in-out infinite}.chara-mecha[data-state=working] .chara-mouth{animation:chara-mecha_talk .32s ease-in-out infinite alternate}.chara-mecha[data-state=working] .chara-glow{animation:chara-mecha_glow .45s steps(2) infinite}.chara-mecha[data-state=working] .chara-arm-l,.chara-mecha[data-state=success] .chara-arm-l{animation:chara-mecha_wave-l .28s ease-in-out infinite alternate}.chara-mecha[data-