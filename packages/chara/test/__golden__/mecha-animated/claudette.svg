][data-mono] .chara-body{animation:chara-mecha_shake 1.9s ease-in-out infinite,chara-mecha_alarm-mono 1.3s ease-in-out infinite}@keyframes chara-mecha_alarm{0%,100%{filter:drop-shadow(0 0 1.5px #ff5247) drop-shadow(0 0 4px #ff5247)}50%{filter:drop-shadow(0 0 3px #ff5247) drop-shadow(0 0 8px #ff5247)}}@keyframes chara-mecha_alarm-mono{0%,100%{filter:drop-shadow(0 0 1.5px #8c8c8c) drop-shadow(0 0 4px #8c8c8c)}50%{filter:drop-shadow(0 0 3px #8c8c8c) drop-shadow(0 0 8px #8c8c8c)}}@keyframes chara-mecha_blink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}@keyframes chara-mecha_glow{0%,100%{opacity:1}50%{opacity:.45}}@keyframes chara-mecha_look{0%,8%{transform:translate(0,0)}18%,42%{transform:translate(-2.4px,-1.6px)}56%,84%{transform:translate(2.4px,-1.6px)}96%,100%{transform:translate(0,0)}}@keyframes chara-mecha_talk{from{transform:scaleY(.45)}to{transform:scaleY(1.25)}}@keyframes chara-mecha_wave-l{from{transform:rotate(8deg)}to{transform:rotate(58deg)}}@keyframes chara-mecha_wave-r{from{transform:rotate(-8deg)}to{transform:rotate(-58deg)}}@keyframes chara-mecha_hop{0%,62%,100%{transform:translateY(0) scale(1)}8%{transform:scale(1.06,.9)}24%{transform:translateY(-9px) scale(.96,1.05)}38%{transform:scale(1.05,.93)}48%{transform:translateY(-4px)}56%{transform:scale(1.02,.97)}}@keyframes chara-mecha_hop-shadow{0%,62%,100%{transform:scaleX(1)}24%{transform:scaleX(.6)}38%{transform:scaleX(1)}48%{transform:scaleX(.8)}}@keyframes chara-mecha_shake{0%,30%,100%{transform:translateX(0) rotate(0)}5%{transform:translateX(-2.2px) rotate(-2deg)}10%{transform:translateX(2.2px) rotate(2deg)}15%{transform:translateX(-1.8px) rotate(-1.5deg)}20%{transform:translateX(1.4px) rotate(1deg)}25%{transform:translateX(-.8px)}}@keyframes chara-mecha_zzz{0%{opacity:0;transform:translate(-2px,3px) scale(.6)}25%{opacity:1}70%{opacity:.9}100%{opacity:0;transform:translate(3px,-6px) scale(1.15)}}@keyframes chara-mecha_sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}@keyframes chara-mecha_float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.4px)}}@keyframes chara-mecha_shadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.86)}}@keyframes chara-mecha_ponder{0%,100%{transform:translateY(0) rotate(-3.5deg)}50%{transform:translateY(-1.6px) rotate(3.5deg)}}@keyframes chara-mecha_droop{0%,100%{transform:rotate(14deg)}50%{transform:rotate(18deg)}}@keyframes chara-mecha_doze{0%,100%{transform:translateY(3.2px) rotate(5deg)}50%{transform:translateY(2px) rotate(5deg)}}@media (prefers-reduced-motion:reduce){.chara-mecha[data-state],.chara-mecha[data-state] *{animation:none!important}}</style><g><ellipse class="chara-shadow" cx="50" cy="95" rx="21" ry="3" fill="#000" opacity="0.16"/><g class="chara-body"><g class="chara-top"><path d="M50 30V22M40 13A10 10 0 0 0 60 13" fill="none" stroke="#6cd651" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="13" r="3" fill="#6cd651" stroke="#6cd651" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M50 30V22M40 13A10 10 0 0 0 60 13" fill="none" stroke="#4c2446" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="13" r="3" fill="#7b47f5" class="chara-glow"/></g><rect x="14" y="47" width="10" height="17" rx="3.5" fill="#6cd651" stroke="#6cd651" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="76" y="47" width="10" height="17" rx="3.5" fill="#6cd651" stroke="#6cd651" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="14" y="47" width="10" height="17" rx="3.5" fill="#2d162a"/><rect x="76" y="47" width="10" height="17" rx="3.5" fill="#2d162a"/><path d="M30 33H70L77 79H23Z" fill="#6cd651" stroke="#6cd651" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 33H70L77 79H23Z" fill="#4c2446" stroke="#4c2446" stroke-width="6" stroke-linejoin="round"/><g class="chara-look"><g class="chara-eyes"><rect x="30" y="45" width="40" heig