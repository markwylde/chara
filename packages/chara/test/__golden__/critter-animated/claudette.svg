<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true" overflow="visible" class="chara chara-critter chara-d6" data-state="thinking"><style>.chara-critter[data-state] *{animation-delay:var(--chara-d,0s)!important}.chara-critter[data-state].chara-d1{--chara-d:-0.6s}.chara-critter[data-state].chara-d2{--chara-d:-1.2s}.chara-critter[data-state].chara-d3{--chara-d:-1.8s}.chara-critter[data-state].chara-d4{--chara-d:-2.4s}.chara-critter[data-state].chara-d5{--chara-d:-3.0s}.chara-critter[data-state].chara-d6{--chara-d:-3.6s}.chara-critter[data-state].chara-d7{--chara-d:-4.2s}.chara-critter[data-state] :is(.chara-body,.chara-top,.chara-eyes,.chara-look,.chara-mouth,.chara-arm,.chara-shadow,.chara-glow,.chara-z){transform-box:fill-box;transform-origin:center}.chara-critter[data-state] .chara-top{transform-origin:50% 100%}.chara-critter[data-state] .chara-arm-l{transform-origin:85% 15%}.chara-critter[data-state] .chara-arm-r{transform-origin:15% 15%}.chara-critter[data-state] .chara-eyes{animation:chara-critter-blink 4.6s infinite}.chara-critter[data-state] .chara-glow{animation:chara-critter-glow 2.6s ease-in-out infinite}.chara-critter[data-state] .chara-body{transform-origin:50% 100%;animation:chara-critter-breathe 3.4s ease-in-out infinite}.chara-critter[data-state] .chara-top{animation:chara-critter-sway 4.4s ease-in-out infinite}.chara-critter[data-state=thinking] .chara-look{animation:chara-critter-look 3.4s ease-in-out infinite}.chara-critter[data-state=thinking] .chara-glow{animation:chara-critter-glow .9s ease-in-out infinite}.chara-critter[data-state=working] .chara-mouth{animation:chara-critter-talk .32s ease-in-out infinite alternate}.chara-critter[data-state=working] .chara-glow{animation:chara-critter-glow .45s steps(2) infinite}.chara-critter[data-state=working] .chara-arm-l,.chara-critter[data-state=success] .chara-arm-l{animation:chara-critter-wave-l .28s ease-in-out infinite alternate}.chara-critter[data-state=working] .chara-arm-r,.chara-critter[data-state=success] .chara-arm-r{animation:chara-critter-wave-r .28s ease-in-out infinite alternate}.chara-critter[data-state=success] .chara-body{animation:chara-critter-hop 1.7s cubic-bezier(.3,.6,.4,1) infinite}.chara-critter[data-state=success] .chara-shadow{animation:chara-critter-hop-shadow 1.7s ease-in-out infinite}.chara-critter[data-state=success] .chara-glow{animation:chara-critter-glow .5s ease-in-out infinite}.chara-critter[data-state=error] .chara-eyes{animation:none}.chara-critter[data-state=error] .chara-glow{fill:#ff5247;animation:chara-critter-glow .5s steps(2) infinite}.chara-critter[data-state=error][data-mono] .chara-glow{fill:#8c8c8c}.chara-critter[data-state=sleeping] .chara-zzz{display:block}.chara-critter[data-state=sleeping] .chara-z{opacity:0;animation:chara-critter-zzz 3.3s ease-out infinite}.chara-critter[data-state=sleeping] .chara-z2{--chara-d:.5s}.chara-critter[data-state=sleeping] .chara-z3{--chara-d:1s}.chara-critter[data-state=sleeping] .chara-eyes{animation:none;transform:scaleY(.1)}.chara-critter[data-state=sleeping] .chara-glow{animation:chara-critter-glow 5s ease-in-out infinite;fill-opacity:.35}.chara-critter[data-state=thinking] .chara-body{animation:chara-critter-lean 3.4s ease-in-out infinite}.chara-critter[data-state=working] .chara-body{animation:chara-critter-bounce .56s ease-in-out infinite}.chara-critter[data-state=sleeping] .chara-body{animation:chara-critter-snooze 5s ease-in-out infinite}.chara-critter[data-state=sleeping] .chara-top{animation:none;transform:rotate(-4deg)}.chara-critter[data-state=error] .chara-body{animation:chara-critter-shake 1.9s ease-in-out infinite,chara-critter-alarm 1.3s ease-in-out infinite}.chara-critter[data-state=error][data-mono] .chara-body{animation:chara-critter-shake 1.9s ease-in-out infinite,chara-critter-alarm-mono 1.3s ease-in-out infinite}@keyframes chara-critter-alarm{0%,100%{filter:drop-shadow(0 0 1.5px #ff5247) drop-shadow(0 0 4px #ff5247)}50%{filter:drop-sha